name: smart_factory_qc
description: Paperless quality control and inventory app for factory shop-floor staff.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Used from day one ---
  image_picker: ^1.1.2          # defect photos (Inspection form)
  flutter_riverpod: ^2.6.1      # state management (swap dummy data for providers)

  # --- Wired in once the API tier exists ---
  dio: ^5.7.0                   # HTTP client for the API tier
  flutter_secure_storage: ^9.2.2 # token storage (never plain SharedPreferences)
  connectivity_plus: ^6.1.0     # drives the offline banner
  drift: ^2.22.0                # local SQLite queue for offline records
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
